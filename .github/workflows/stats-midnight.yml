name: Cào thống kê CCTS lúc 0h VN (thay wake-before-midnight.yml)

# Chạy đúng lệnh `python stats_data.py` mà trước đây phải bấm tay ở local,
# nhưng trên máy ảo GitHub Actions — KHÔNG phụ thuộc Render đang ngủ hay
# thức. stats_data.refresh_stats_cache() tự cào CCTS (tài khoản cố định
# trong ccts_shared.STATS_SCRAPE_ACCOUNTS), build charts, rồi cache_store.py
# tự đẩy kết quả lên R2/S3 (CACHE_S3_*). Render chỉ cần đọc cache này khi có
# người truy cập /stats — không cần tự cào, không cần "sống" đúng lúc 0h.
#
# Cần thêm Secrets trong repo (Settings > Secrets and variables > Actions)
# trước khi bật lịch tự động — xem README_STATS_MIDNIGHT.txt đi kèm.
on:
  schedule:
    # 17:05 UTC = 00:05 giờ Việt Nam (UTC+7). Giờ UTC không đổi theo DST VN
    # (VN không có DST) nên không cần chỉnh theo mùa.
    - cron: "5 17 * * *"
  workflow_dispatch: {}  # cho phép bấm "Run workflow" để test tay trước khi tin lịch 0h

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    # Dư sức so với worst-case hiện tại của stats_source.py (mỗi tài khoản
    # tối đa 10 vòng retry x (EXPORT_TIMEOUT_SECONDS=180s + SCRAPE_RETRY_
    # DELAY_SECONDS=20s) ≈ 33'/tài khoản) — GitHub Actions cho tối đa 6h/job.
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài dependencies
        run: pip install -r requirements.txt

      - name: Cào thống kê CCTS + đẩy cache lên R2/S3
        env:
          # ---- Tài khoản CCTS dùng để cào thống kê ----
          CCTS_USERNAME_ES: ${{ secrets.CCTS_USERNAME_ES }}
          CCTS_PASSWORD: ${{ secrets.CCTS_PASSWORD }}
          # ---- Google Sheets (map KTV / users) ----
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_URL: ${{ secrets.SPREADSHEET_URL }}
          # ---- Dữ liệu tĩnh (StationData.csv...) đọc từ GitHub ----
          GITHUB_DATA_REPO: ${{ secrets.GITHUB_DATA_REPO }}
          # LƯU Ý: "GITHUB_TOKEN" là tên RESERVED, GitHub không cho tạo secret
          # trùng tên này. Tạo secret với tên khác (vd DATA_REPO_TOKEN) rồi
          # map lại thành đúng biến GITHUB_TOKEN mà config.py/github_data_store.py
          # đang đọc qua os.environ.get("GITHUB_TOKEN").
          GITHUB_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          # ---- Object storage R2/S3 lưu cache (cache_store.py) ----
          CACHE_S3_BUCKET: ${{ secrets.CACHE_S3_BUCKET }}
          CACHE_S3_ACCESS_KEY: ${{ secrets.CACHE_S3_ACCESS_KEY }}
          CACHE_S3_SECRET_KEY: ${{ secrets.CACHE_S3_SECRET_KEY }}
          CACHE_S3_ENDPOINT: ${{ secrets.CACHE_S3_ENDPOINT }}
        run: python stats_data.py

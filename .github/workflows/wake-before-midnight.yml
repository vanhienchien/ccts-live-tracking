name: Đánh thức app trước 0h VN

# 2026-09-15: workflow này KHÔNG còn giải quyết được vấn đề gốc — dù đánh
# thức Render lúc 23:50 VN, nếu lượt cào thống kê 0h (chạy bên trong tiến
# trình web, xem stats_midnight_loop() trong main.py) kéo dài hơn cửa sổ
# không-traffic của Render, Render vẫn tự ngủ lại GIỮA CHỪNG và mất cache
# chưa kịp lưu.
#
# Đã thay bằng stats-midnight.yml: chạy hẳn `python stats_data.py` trên
# GitHub Actions (không phụ thuộc Render sống hay ngủ), đẩy cache thẳng lên
# R2/S3 — Render chỉ cần đọc cache khi có người ghé /stats.
#
# Giữ lại file này ở dạng CHỈ BẤM TAY (workflow_dispatch) phòng khi cần
# đánh thức Render thủ công vì lý do khác (vd trước 1 buổi demo) — đã TẮT
# lịch tự động 23:50 hàng ngày để không tốn traffic/giờ chạy vô ích.
on:
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz để đánh thức Render (nếu đang ngủ)
        run: |
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 \
            "https://ccts-live-tracking.onrender.com/healthz"
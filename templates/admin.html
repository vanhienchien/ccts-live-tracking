<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng điều khiển Admin - CCTS Live Map</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #f4f6f8; }
  .header {
    background: #2c3e50; color: #fff; padding: 12px 20px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .header h2 { margin: 0; font-size: 17px; }
  .header a {
    color: #fff; text-decoration: none; background: rgba(255,255,255,.15);
    padding: 6px 14px; border-radius: 6px; font-size: 13px;
  }
  .header a:hover { background: rgba(255,255,255,.28); }
  .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.06); padding: 18px; margin-bottom: 20px; }
  .card h3 { margin: 0 0 14px; color: #2c3e50; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f4f6f8; text-align: left; padding: 8px 10px; color: #555; font-weight: 600; }
  td { padding: 8px 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
  select {
    padding: 6px 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; min-width: 160px;
  }
  .save-btn {
    padding: 6px 14px; border-radius: 6px; border: none; background: #2c3e50; color: #fff;
    font-size: 12px; cursor: pointer;
  }
  .save-btn:hover { background: #1a252f; }
  .save-btn:disabled { opacity: .5; cursor: not-allowed; }
  .status-msg { font-size: 12px; margin-left: 8px; }
  .status-msg.ok { color: #27ae60; }
  .status-msg.err { color: #e74c3c; }
  @media (max-width: 700px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tr { border-bottom: 2px solid #eee; padding: 8px 0; }
    td { border: none; padding: 4px 0; }
    td::before { content: attr(data-label); font-weight: 700; color: #999; display: block; font-size: 11px; }
  }
</style>
</head>
<body data-username="{{ user.username }}">
  <div class="header">
    <h2>⚙️ Bảng điều khiển Admin</h2>
    <a href="/">← Về bản đồ</a>
  </div>

  <div class="container">
    <div class="card">
      <h3>👤 Cấp quyền tài khoản</h3>
      <p style="font-size:12.5px;color:#888;margin-top:-8px;">
        Đổi vai trò (chức vụ) trực tiếp tại đây. Các thông tin khác (họ tên, mật khẩu, khu vực)
        vẫn chỉnh sửa trực tiếp trên Google Sheets như trước.
      </p>
      <div id="users-table-wrap">Đang tải danh sách tài khoản...</div>
    </div>
  </div>

  <script src="/static/admin.js"></script>
</body>
</html>

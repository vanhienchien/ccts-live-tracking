<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTS Bản đồ trạm sạc · ELECSERVE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1e293b;
    --bg: #f1f5f9;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --radius: 12px;
    --shadow: 0 4px 16px rgba(15, 23, 42, .08);
    --ev-color: #dc2626;
    --bss-color: #2563eb;
    --topbar-h: 56px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .topbar {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #f8fafc;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,.2);
    flex-wrap: wrap;
    position: relative;
    z-index: 1000;
  }
  .topbar h1 { margin: 0; font-size: 16.5px; font-weight: 600; white-space: nowrap; margin-right: 4px; }

  /* Chip lọc EV/BSS - cùng phong cách với bản đồ sự cố (map.html) */
  .filter-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 20px;
    font-size: 12.5px; font-weight: 500; cursor: pointer;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    color: rgba(255,255,255,.85); user-select: none;
    transition: background .15s, border-color .15s, color .15s;
    white-space: nowrap;
  }
  .filter-chip:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); }
  .filter-chip input { display: none; }
  .filter-chip .chip-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.28); }
  .filter-chip.ev.active { background: rgba(220,38,38,.22); border-color: rgba(248,113,113,.45); color: #fecaca; }
  .filter-chip.ev.active .chip-dot { background: #f87171; }
  .filter-chip.bss.active { background: rgba(37,99,235,.22); border-color: rgba(96,165,250,.45); color: #bfdbfe; }
  .filter-chip.bss.active .chip-dot { background: #60a5fa; }

  #mode-toggle-btn {
    background: rgba(255,255,255,.08); color: #f1f5f9;
    border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
    padding: 6px 12px; font-size: 12.5px; font-family: inherit; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  #mode-toggle-btn:hover { background: rgba(255,255,255,.14); }
  #mode-toggle-btn.no-cluster { background: rgba(249,115,22,.22); border-color: rgba(253,186,116,.45); color: #fdba74; }

  .topbar .meta {
    margin-left: auto;
    font-size: 12.5px;
    color: #94a3b8;
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
  }
  .topbar .badge {
    background: rgba(249, 115, 22, .2);
    color: #fdba74;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
  }
  .topbar a {
    color: #cbd5e1;
    text-decoration: none;
    font-weight: 500;
  }
  .topbar a:hover { color: #fff; }

  #map {
    width: 100%;
    height: calc(100vh - var(--topbar-h));
  }

  /* ========== POPUP TRẠM SẠC ==========
     Ghi đè hẳn padding mặc định của Leaflet popup (không đoán/trừ margin
     âm) - toàn bộ khoảng cách do .cp-header/.cp-body tự kiểm soát. */
  .charge-station-popup .leaflet-popup-content-wrapper {
    padding: 0; border-radius: 14px; overflow: hidden;
  }
  .charge-station-popup .leaflet-popup-content { margin: 0; width: auto !important; }
  .charge-popup { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; width: 250px; }
  .charge-popup .cp-header {
    padding: 10px 16px;
    font-weight: 700; font-size: 14.5px; color: #fff;
    letter-spacing: .01em;
  }
  .charge-popup .cp-body { padding: 12px 16px; }
  .charge-popup .cp-addr {
    display: flex; gap: 6px; color: var(--text); font-size: 12.5px;
    margin-bottom: 5px; line-height: 1.4;
  }
  .charge-popup .cp-tech {
    display: flex; gap: 6px; color: var(--text-muted); font-size: 12px;
    margin-bottom: 8px;
  }
  .charge-popup .cp-counts { display: flex; gap: 8px; margin-bottom: 8px; }
  .charge-popup .cp-count-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  }
  .charge-popup .cp-count-pill.ev { background: #fee2e2; color: var(--ev-color); }
  .charge-popup .cp-count-pill.bss { background: #dbeafe; color: var(--bss-color); }
  .charge-popup .cp-divider { height: 1px; background: #f1f5f9; margin: 0 0 8px; }
  .charge-popup .cp-poles-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    color: var(--text-muted); margin-bottom: 5px;
  }
  .charge-popup .cp-poles-scroll { max-height: 160px; overflow-y: auto; }
  .charge-popup .cp-pole {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; padding: 3px 0; color: var(--text);
  }
  .charge-popup .cp-pole.ev { color: var(--ev-color); }
  .charge-popup .cp-pole.bss { color: var(--bss-color); }
  .charge-popup .cp-pole .sn { color: var(--text); font-weight: 500; }

  /* ========== BẢNG LỌC KỸ THUẬT VIÊN (theo khu vực) ========== */
  #tech-panel-handle {
    position: fixed;
    top: 42%; right: 0;
    transform: translateY(-50%);
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px 0 0 10px;
    padding: 16px 8px;
    cursor: pointer;
    z-index: 900;
    font-size: 15px;
    box-shadow: -3px 0 12px rgba(0,0,0,.15);
    transition: background .15s;
  }
  #tech-panel-handle:hover { background: #334155; }
  #tech-panel-handle.hidden { display: none; }

  #tech-panel {
    position: fixed;
    top: calc(var(--topbar-h) + 12px); right: 12px; bottom: 12px;
    width: 340px;
    max-width: calc(100vw - 24px);
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(15,23,42,.18), 0 0 0 1px rgba(15,23,42,.06);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 950;
  }
  #tech-panel.open { display: flex; }
  #tech-panel .tech-panel-head {
    flex-shrink: 0;
    padding: 12px 8px 12px 16px;
    border-bottom: 1px solid var(--border);
    background: #fff;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  }
  #tech-panel .tech-panel-head h3 {
    margin: 0 0 4px; font-size: 15px; font-weight: 700; color: var(--text);
  }
  #tech-selected-count { font-size: 12px; color: var(--text-muted); }
  #tech-panel-close {
    flex-shrink: 0; width: 32px; height: 32px; border: none; border-radius: 10px;
    background: #f1f5f9; color: #64748b; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  #tech-panel-close:hover { background: #fee2e2; color: #dc2626; }
  #tech-panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    background: #f8fafc;
  }
  .tech-panel-empty { padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px; }

  .region-group {
    margin-bottom: 6px;
    border: 1px solid #eef2f7;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
  }
  .region-group.expanded { border-color: #e2e8f0; box-shadow: 0 1px 3px rgba(15,23,42,.04); }
  .region-header {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px;
    cursor: pointer; user-select: none;
    font-size: 12.5px; font-weight: 700;
    color: var(--text);
    background: #f8fafc;
    transition: background .12s;
  }
  .region-header:hover { background: #f1f5f9; }
  .region-group.expanded .region-header { border-bottom: 1px solid #eef2f7; }
  .region-header .region-check { width: 15px; height: 15px; accent-color: var(--ev-color); flex-shrink: 0; }
  .region-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .region-count {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    background: #e2e8f0; padding: 1px 7px; border-radius: 999px;
  }
  .region-header .chevron {
    font-size: 11px; color: #94a3b8; transition: transform .2s; width: 14px; text-align: center;
  }
  .region-group.expanded .region-header .chevron { transform: rotate(90deg); color: #64748b; }
  .region-techs { display: none; padding: 4px 0 6px; }
  .region-group.expanded .region-techs { display: block; }

  .tech-row {
    display: block;
    padding: 7px 10px 7px 26px; border-radius: 8px; cursor: pointer;
    font-size: 13px; color: var(--text);
    margin: 0 4px;
    transition: background .12s;
  }
  .tech-row:hover { background: #f8fafc; }
  .tech-row.selected { background: #eef2ff; }
  .tech-row-top { display: flex; align-items: center; gap: 8px; }
  .tech-row input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--ev-color); flex-shrink: 0; }
  .tech-name {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 500;
  }
  .tech-counts { display: flex; gap: 5px; margin-top: 4px; padding-left: 23px; }
  .tc {
    font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 999px;
    white-space: nowrap;
  }
  .tc.ev { background: #fee2e2; color: var(--ev-color); }
  .tc.bss { background: #dbeafe; color: var(--bss-color); }
  .tc.total { background: #ffedd5; color: #c2410c; }

  #tech-panel-actions {
    flex-shrink: 0;
    display: flex; gap: 8px;
    padding: 10px 12px 12px;
    border-top: 1px solid #eef2f7;
    background: #fafbfc;
  }
  #tech-panel-actions button {
    flex: 1; font-size: 12.5px; font-weight: 600;
    padding: 8px; border: 1px solid #e2e8f0; border-radius: 10px;
    background: #fff; color: #334155; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  #tech-panel-actions button:hover { background: #f1f5f9; border-color: #cbd5e1; }

  /* ========== THỐNG KÊ TRỤ THIẾU TOẠ ĐỘ ========== */
  #missing-coord-badge {
    display: none;
    align-items: center;
    background: rgba(220, 38, 38, .22);
    color: #fca5a5;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  #missing-coord-badge:hover { background: rgba(220, 38, 38, .32); }
  #missing-coord-panel {
    position: absolute;
    top: 100%; right: 24px; margin-top: 8px;
    width: 300px; max-height: 340px; overflow-y: auto;
    background: #fff; color: var(--text);
    border-radius: 12px; box-shadow: var(--shadow);
    border: 1px solid var(--border);
    display: none;
    z-index: 2000;
  }
  #missing-coord-panel.open { display: block; }
  .mc-item { padding: 9px 12px; font-size: 12.5px; border-bottom: 1px solid #f1f5f9; }
  .mc-item:last-child { border-bottom: none; }
  .mc-sn { font-weight: 600; color: var(--text); }
  .mc-meta { color: var(--text-muted); font-size: 11.5px; margin-top: 2px; }
  .mc-more { padding: 10px 12px; text-align: center; font-size: 12px; color: var(--text-muted); }

  @media (max-width: 640px) {
    .topbar { padding: 8px 12px; gap: 8px; }
    .topbar h1 { font-size: 13.5px; width: 100%; }
    .topbar .meta { font-size: 11px; gap: 8px; }
    #tech-panel { top: calc(var(--topbar-h) + 8px); right: 8px; bottom: 8px; left: 8px; width: auto; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <h1>🗺️ CCTS · Bản đồ tổng hợp trạm sạc</h1>
    <label class="filter-chip ev active" id="chip-ev">
      <input type="checkbox" id="filter-ev" checked>
      <span class="chip-dot"></span> ⚡ EV
    </label>
    <label class="filter-chip bss active" id="chip-bss">
      <input type="checkbox" id="filter-bss" checked>
      <span class="chip-dot"></span> 🔋 BSS
    </label>
    <button id="mode-toggle-btn" title="Chuyển giữa gom nhóm và hiện tất cả trạm riêng lẻ">🔗 Gom nhóm</button>
    <div class="meta" style="position:relative;">
      <span class="badge" id="summary-badge">Đang tải…</span>
      <button id="missing-coord-badge" title="Bấm để xem danh sách trụ thiếu toạ độ"></button>
      <div id="missing-coord-panel"></div>
      {% if user %}<span style="color:#94a3b8;font-size:12.5px;">{{ user.full_name or user.username }}</span>{% endif %}
      <a href="/">← Bản đồ live</a>
      <a href="/stats">📊 Thống kê</a>
    </div>
  </div>

  <div id="map"></div>

  <button id="tech-panel-handle" title="Số trụ mỗi kỹ thuật viên quản lý">◀ 🧑‍🔧</button>
  <div id="tech-panel">
    <div class="tech-panel-head">
      <div>
        <h3>Số trụ theo kỹ thuật viên</h3>
        <div id="tech-selected-count">Chưa lọc — hiện tất cả</div>
      </div>
      <button id="tech-panel-close" title="Đóng">✕</button>
    </div>
    <div id="tech-panel-body"><div class="tech-panel-empty">Đang tải…</div></div>
    <div id="tech-panel-actions">
      <button type="button" id="tech-select-all">Chọn tất cả</button>
      <button type="button" id="tech-clear-all">Bỏ chọn</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/static/js/all_stations_map.js"></script>
  <script>
    // Đo chiều cao THẬT của topbar (có thể xuống 2 hàng trên màn nhỏ do vừa
    // thêm chip lọc + nút chế độ) và ghi vào --topbar-h - #map và #tech-panel
    // đều dựa vào biến này để không bao giờ bị hở/đè, giống cơ chế map.html.
    (function () {
      const topbarEl = document.querySelector('.topbar');
      if (!topbarEl) return;
      function syncTopbarHeight() {
        const h = topbarEl.offsetHeight;
        if (h > 0) document.documentElement.style.setProperty('--topbar-h', h + 'px');
      }
      syncTopbarHeight();
      if (window.ResizeObserver) {
        new ResizeObserver(syncTopbarHeight).observe(topbarEl);
      } else {
        window.addEventListener('resize', syncTopbarHeight);
      }
      window.addEventListener('load', syncTopbarHeight);
    })();
  </script>
</body>
</html>

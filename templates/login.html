<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCTS Live Map - Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#071627;color:#fff;min-height:100vh;display:flex;position:relative;}

/* --- PHẦN ĐĂNG NHẬP (BÊN TRÁI TRÊN DESKTOP) --- */
.left-login {
    width: 460px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    background: rgba(3, 12, 22, 0.95);
    z-index: 2;
    box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
}

.card {
    width: 100%;
    max-width: 360px;
    padding: 35px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(16px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
}

.logo { text-align: center; }
.logo img { max-width: 250px; width: 100%; }
h2 { text-align: center; margin: 12px 0 4px; }
.sub { text-align: center; color: #b6c9d8; font-size: 13px; margin-bottom: 24px; }
label { display: block; margin: 12px 0 6px; color: #cfe6f5; }

.input {
    display: flex;
    align-items: center;
    background: #0d2238;
    border: 1px solid #244c69;
    border-radius: 12px;
    padding: 0 12px;
}
.input span { margin-right: 8px; }
.input input {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    padding: 14px 0;
    outline: none;
}

/* Fix lỗi autofill bị bôi trắng */
input:-webkit-autofill,
input:-webkit-autofill:hover, 
input:-webkit-autofill:focus, 
input:-webkit-autofill:active {
    -webkit-box-shadow: 0 0 0 30px #0d2238 inset !important;
    -webkit-text-fill-color: #ffffff !important;
    transition: background-color 5000s ease-in-out 0s;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #00d4ff, #00a0ff);
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.35);
    transition: transform 0.2s;
}
button:hover { transform: translateY(-2px); }

.error { background: #4a1116; color: #ffd2d2; padding: 10px; border-radius: 10px; margin-bottom: 15px; }
.footer { display: flex; justify-content: space-between; font-size: 12px; color: #98b6c7; margin-top: 18px; }
.online { color: #22c55e; }

/* --- PHẦN BẢN ĐỒ NỀN & INFO (BÊN PHẢI TRÊN DESKTOP) --- */
.right-map {
    flex: 1;
    position: relative;
    background: url('/static/images/background.png') no-repeat center center;
    background-size: cover;
    overflow: hidden;
}

.info {
    position: absolute;
    right: 40px;
    bottom: 50px;
    max-width: 380px;
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.08) 0%, rgba(7, 22, 39, 0) 100%);
    padding: 18px 24px;
    border-radius: 12px;
    backdrop-filter: blur(3px);
    border: 1px solid rgba(0, 212, 255, 0.15);
    border-right: 4px solid #00d4ff; /* Viền nhấn chuyển sang phải */
}

.info h1 {
    font-size: 24px;
    margin: 0 0 8px;
    color: #00d4ff;
    text-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
    letter-spacing: 1px;
}

.info p {
    color: #98b6c7;
    font-size: 13px;
    line-height: 1.6;
    margin: 0;
}

/* Dấu ấn tác giả */
.creator-watermark {
    position: fixed;
    bottom: 12px;
    right: 15px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.35);
    letter-spacing: 0.5px;
    pointer-events: none;
    z-index: 1000;
}

/* --- TỐI ƯU HÓA TRÊN ĐIỆN THOẠI (MOBILE RESPONSIVE) --- */
@media(max-width: 900px) {
    body {
        flex-direction: column; /* Xếp dọc trên mobile */
    }
    .left-login {
        width: 100%;
        min-height: auto;
        padding: 30px 20px;
        background: #071627;
    }
    .card {
        max-width: 100%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .right-map {
        min-height: 280px; /* Hiển thị gọn bản đồ phía dưới khung đăng nhập */
        width: 100%;
    }
    .info {
        right: 20px;
        left: 20px;
        bottom: 20px;
        max-width: none;
        padding: 15px;
        border-right: none;
        border-left: 4px solid #00d4ff; /* Đổi lại viền sang trái trên mobile cho thuận mắt */
    }
    .info h1 {
        font-size: 20px;
    }
}
</style>
</head>
<body>

<!-- Phần Đăng nhập chuyển sang bên trái -->
<div class="left-login">
    <div class="card">
        <div class="logo"><img src="{{ url_for('static', path='images/logo-remove.png') }}" alt="logo"></div>
        <h2>Control Center</h2>
        <div class="sub">Secure access to EV Charging Monitoring System</div>
        
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        
        <form method="post" action="/login">
            <label>Tên đăng nhập</label>
            <div class="input">
                <span>👤</span>
                <input type="text" name="username" required autofocus autocomplete="username">
            </div>
            
            <label>Mật khẩu</label>
            <div class="input">
                <span>🔒</span>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
            
            <button type="submit">ĐĂNG NHẬP HỆ THỐNG</button>
        </form>
        
        <div class="footer">
            <span class="online">● System Online</span>
            <span>Version 2.0</span>
        </div>
    </div>
</div>

<!-- Phần Bản đồ & Khối CCTS LIVE MAP chuyển sang bên phải -->
<div class="right-map">
    <div class="info">
        <h1>CCTS LIVE MAP</h1>
        <p>Real-time EV Charging Station Monitoring Platform<br>Fault Detection • Technician Dispatch • Live Tracking</p>
    </div>
</div>

<!-- Dấu ấn tác giả -->
<div class="creator-watermark">Created by Van Hien Chien</div>

</body>
</html>

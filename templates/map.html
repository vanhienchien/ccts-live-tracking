<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTS Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  .custom-popup .leaflet-popup-content::-webkit-scrollbar {
    width: 6px;
  }
  .custom-popup .leaflet-popup-content::-webkit-scrollbar-thumb {
    background: #ccc;
    border-radius: 3px;
  }
  html, body { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
  .header {
    background: #2c3e50; color: #fff; padding: 10px 18px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px;
  }
  .header h2 { margin: 0; font-size: 17px; white-space: nowrap; }
  .header .info { font-size: 13px; opacity: .92; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge { background: #e74c3c; padding: 3px 10px; border-radius: 12px; font-size: 13px; }
  #map { width: 100%; height: calc(100vh - 54px); }
  .logout {
    color: #fff; text-decoration: none; background: rgba(255,255,255,.15);
    padding: 5px 12px; border-radius: 6px; font-size: 13px;
  }
  .logout:hover { background: rgba(255,255,255,.28); }
  .staff-avatar {
    border-radius: 50%; color: #fff; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 12px;
    border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  .wrench-badge {
    border-radius: 50%; background: #fff; color: #e67e22; display: flex;
    align-items: center; justify-content: center; font-size: 13px;
    border: 2px solid #e67e22; box-shadow: 0 2px 5px rgba(0,0,0,.4);
  }
  .conn-dot {
    width: 9px; height: 9px; border-radius: 50%; display: inline-block;
    background: #e74c3c; margin-right: 4px;
  }
  .conn-dot.ok { background: #2ecc71; }
</style>
</head>
<body>
  <div class="header">
    <h2>⚡ CCTS Live Map</h2>
    <div class="info">
      <span>👋 {{ user.full_name }} · {{ user.role }}{% if user.region %} · {{ user.region }}{% endif %}</span>
      <span>Sự cố đang mở: <span class="badge" id="ticket-count">–</span></span>
      <span><span class="conn-dot" id="conn-dot"></span><span id="conn-text">Đang kết nối...</span></span>
      <a class="logout" href="/logout">Đăng xuất</a>
    </div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

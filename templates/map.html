<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTS Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
  .header {
    background: #2c3e50; color: #fff; padding: 10px 18px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px; position: relative; z-index: 1000;
  }
  .header h2 { margin: 0; font-size: 17px; white-space: nowrap; }
  .header .info { font-size: 13px; opacity: .92; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge { background: #e74c3c; padding: 3px 10px; border-radius: 12px; font-size: 13px; }
  #map { width: 100%; height: calc(100vh - 54px); position: relative; }
  .logout {
    color: #fff; text-decoration: none; background: rgba(255,255,255,.15);
    padding: 5px 12px; border-radius: 6px; font-size: 13px;
  }
  .logout:hover { background: rgba(255,255,255,.28); }
  .staff-avatar {
    border-radius: 50%; color: #fff; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 12px;
    border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  .wrench-badge {
    border-radius: 50%; background: #fff; color: #e67e22; display: flex;
    align-items: center; justify-content: center; font-size: 13px;
    border: 2px solid #e67e22; box-shadow: 0 2px 5px rgba(0,0,0,.4);
  }
  .conn-dot {
    width: 9px; height: 9px; border-radius: 50%; display: inline-block;
    background: #e74c3c; margin-right: 4px;
  }
  .conn-dot.ok { background: #2ecc71; }

  /* --- Thanh tìm kiếm --- */
  .search-wrap { position: relative; }
  #search-input {
    padding: 6px 10px; border-radius: 6px; border: none; font-size: 13px;
    width: 190px; outline: none;
  }
  #search-results {
    position: absolute; top: 34px; left: 0; width: 260px; background: #fff;
    color: #222; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
    max-height: 320px; overflow-y: auto; display: none; z-index: 2000;
  }
  #search-results .item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #eee; }
  #search-results .item:hover { background: #f2f4f6; }
  #search-results .item .tag { font-size: 11px; color: #888; }
  #search-results .empty { padding: 10px 12px; font-size: 13px; color: #999; }

  /* --- Nút header dạng toggle --- */
  .hdr-btn {
    background: rgba(255,255,255,.15); color: #fff; border: none; border-radius: 6px;
    padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .hdr-btn:hover { background: rgba(255,255,255,.28); }

  /* --- Panel lọc kỹ thuật viên --- */
  #tech-filter-panel {
    position: absolute; top: 60px; right: 12px; width: 300px; max-height: 70vh;
    overflow-y: auto; background: #fff; border-radius: 10px;
    box-shadow: 0 8px 26px rgba(0,0,0,.3); display: none; z-index: 1500; padding: 10px 4px;
  }
  #tech-filter-panel .region-group { margin-bottom: 4px; }
  #tech-filter-panel .region-title {
    font-weight: 700; font-size: 13px; color: #2c3e50; padding: 6px 10px;
    background: #f4f6f8; border-radius: 6px; margin: 4px 6px;
  }
  #tech-filter-panel label {
    display: flex; align-items: center; gap: 6px; padding: 5px 16px;
    font-size: 13px; cursor: pointer;
  }
  #tech-filter-panel label:hover { background: #f8f9fa; }
  #tech-filter-actions {
    display: flex; justify-content: space-between; padding: 6px 10px; gap: 6px;
    border-top: 1px solid #eee; margin-top: 4px;
  }
  #tech-filter-actions button {
    flex: 1; font-size: 12px; padding: 6px; border: 1px solid #ddd; border-radius: 6px;
    background: #fff; cursor: pointer;
  }
  #tech-filter-actions button:hover { background: #f2f4f6; }

  /* --- Nút "Vị trí của bạn" nổi trên bản đồ --- */
  #my-location-btn {
    position: absolute; bottom: 24px; right: 12px; z-index: 900;
    width: 42px; height: 42px; border-radius: 50%; background: #fff; border: none;
    box-shadow: 0 3px 10px rgba(0,0,0,.35); font-size: 19px; cursor: pointer;
  }
  #my-location-btn:hover { background: #f2f4f6; }

/* Hiệu ứng xoay cà lê sửa chữa sinh động */
@keyframes wrench-repair {
    0% { transform: rotate(0deg); }
    20% { transform: rotate(-35deg); }
    40% { transform: rotate(20deg); }
    60% { transform: rotate(-20deg); }
    80% { transform: rotate(10deg); }
    100% { transform: rotate(0deg); }
}

.wrench-pure-icon {
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.4));
    animation: wrench-repair 1.2s infinite ease-in-out;
    transform-origin: center center;
}

/* ==========================================
   Responsive - đa số nhân viên dùng điện thoại
   ========================================== */
@media (max-width: 700px) {
  .header {
    flex-direction: column;
    align-items: stretch;
    padding: 8px 10px;
    gap: 6px;
  }
  .header h2 { font-size: 15px; text-align: center; }
  .header .info {
    font-size: 12px;
    justify-content: center;
    gap: 6px;
  }
  .user-detail { display: none; } /* Ẩn dòng tên/chức vụ/khu vực trên di động để đỡ chật */
  .conn-text-label { display: none; } /* Chỉ giữ chấm online, ẩn chữ "Đang kết nối..." */
  .search-wrap { flex: 1 1 100%; order: 1; }
  #search-input { width: 100%; box-sizing: border-box; font-size: 16px; }
  #search-results { width: 100%; max-width: calc(100vw - 20px); }
  .hdr-btn { font-size: 12px; padding: 6px 10px; }
  #tech-filter-panel {
    left: 10px; right: 10px; width: auto; top: auto; bottom: 10px;
    max-height: 60vh;
  }
  #my-location-btn { bottom: 16px; right: 10px; width: 46px; height: 46px; }
  #map { height: calc(100vh - 96px); }
}
</style>
</head>
<body data-username="{{ user.username }}">
  <div class="header">
    <h2>⚡ CCTS Live Map</h2>
    <div class="info">
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="🔍 Tìm trạm / kỹ thuật viên...">
        <div id="search-results"></div>
      </div>
      <button class="hdr-btn" id="tech-filter-btn">🧑‍🔧 Lọc kỹ thuật viên</button>
      <span class="user-detail">👋 {{ user.full_name }} · {{ user.role }}{% if user.region %} · {{ user.region }}{% endif %}</span>
      <span>Sự cố đang mở: <span class="badge" id="ticket-count">–</span></span>
      <span><span class="conn-dot" id="conn-dot"></span><span class="conn-text-label" id="conn-text">Đang kết nối...</span></span>
      {% if user.role and user.role.strip().lower() == 'admin' %}
        <button id="btn-manual-refresh" onclick="triggerManualRefresh()" style="padding: 4px 10px; cursor: pointer; border-radius: 4px; border: 1px solid #1f77b4; background: #ffffff; color: #1f77b4; font-weight: bold; font-size: 13px; margin: 0 5px;">
          🔄
        </button>
      {% endif %}
      <a class="logout" href="/logout">Đăng xuất</a>
    </div>
  </div>

  <div id="map">
    <div id="tech-filter-panel"></div>
    <button id="my-location-btn" title="Vị trí của bạn">📍</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

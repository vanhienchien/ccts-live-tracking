<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCTS Thống kê · ELECSERVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <style>
    /* ============================================================
       CSS DÙNG CHUNG cho khung trang (topbar, tab, KPI, card, v.v.).
       CSS RIÊNG cho từng loại biểu đồ (vd heatmap của module volume)
       được chính module JS đó tự chèn vào <head> lúc đăng ký — xem
       StatsCore.injectStyleOnce() trong stats_core.js — nên file này
       KHÔNG cần sửa khi thêm loại biểu đồ mới.
       ============================================================ */
    :root {
      --primary: #1e293b;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(15, 23, 42, .08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .topbar {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.2);
      flex-wrap: wrap;
    }
    .topbar h1 { margin: 0; font-size: 17px; font-weight: 600; }
    .topbar .meta {
      margin-left: auto;
      font-size: 12.5px;
      color: #94a3b8;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    .topbar .badge {
      background: rgba(249, 115, 22, .2);
      color: #fdba74;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 12px;
    }
    .topbar a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.12);
    }
    .topbar a:hover { background: rgba(255,255,255,.1); color: #fff; }

    .chart-type-tabs {
      display: flex;
      gap: 6px;
      background: rgba(255,255,255,.08);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      flex-wrap: wrap;
    }
    .chart-type-tabs button {
      border: none;
      background: transparent;
      color: #94a3b8;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .chart-type-tabs button.active { background: #f97316; color: #fff; }
    .chart-type-tabs button:hover:not(.active) { color: #e2e8f0; background: rgba(255,255,255,.08); }

    .view-toggle {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 10px;
    }
    .view-toggle button {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .view-toggle button.active { background: #f97316; color: #fff; }
    .view-toggle button:hover:not(.active) { color: var(--text); background: #e2e8f0; }

    .container { max-width: 1100px; margin: 0 auto; padding: 20px 20px 40px; }

    .kpi-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      margin-bottom: 12px;
      overflow-x: auto;
    }
    .kpi {
      flex: 1 1 0;
      min-width: 0;
      background: var(--surface);
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .kpi .label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin: 0;
      white-space: nowrap;
    }
    .kpi .value {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
    }
    .kpi .sub {
      font-size: 11px;
      color: var(--text-muted);
      margin: 0;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cp-filter {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .cp-filter button {
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text-muted);
      cursor: pointer;
    }
    .cp-filter button:hover { border-color: #94a3b8; color: var(--text); }
    .cp-filter button.active {
      background: #0f172a;
      border-color: #0f172a;
      color: #fff;
    }
    .cp-filter button.active[data-cp="ev"] { background: #0369a1; border-color: #0369a1; }
    .cp-filter button.active[data-cp="bss"] { background: #7c3aed; border-color: #7c3aed; }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 20px 22px 16px;
      margin-bottom: 20px;
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .card-header h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .card-header .desc { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .region-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .region-tab {
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
    }
    .region-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .legend-toggle { display: flex; flex-wrap: wrap; gap: 8px; }
    .legend-chip {
      font-size: 12px;
      font-weight: 500;
      padding: 4px 11px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      cursor: pointer;
      color: var(--text-muted);
    }
    .legend-chip.active { border-color: transparent; color: #fff; }

    .chart-wrap { position: relative; height: 380px; width: 100%; }
    .source-note { font-size: 12px; color: var(--text-muted); text-align: right; margin-top: 8px; }
    .source-note.sample { color: #d97706; }
    .loading { text-align: center; padding: 80px 20px; color: var(--text-muted); font-size: 14px; }

    @media (max-width: 640px) {
      .chart-wrap { height: 300px; }
      .kpi-row { flex-wrap: wrap; }
      .kpi { flex: 1 1 calc(50% - 10px); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>📊 CCTS · Thống kê sự cố</h1>
    <!-- Các nút tab được StatsCore tự sinh ra khi mỗi module chart JS gọi
         registerChart() — không khai báo cứng ở đây. -->
    <div class="chart-type-tabs" id="chart-type-tabs"></div>
    <div class="meta">
      <span class="badge" id="source-badge">Đang tải…</span>
      <span id="gen-at">—</span>
      {% if user %}<span style="color:#94a3b8;font-size:12.5px;">{{ user.full_name or user.username }}</span>{% endif %}
      <a href="/">← Bản đồ live</a>
    </div>
  </div>

  <div class="container">
    <!-- 4 ô KPI dùng chung cho MỌI loại biểu đồ — mỗi module tự quyết định
         nội dung 4 ô này qua StatsCore.setKPIs() mỗi khi được hiển thị. -->
    <div class="kpi-row" id="kpi-row">
      <div class="kpi"><div class="label">—</div><div class="value">—</div><div class="sub">—</div></div>
      <div class="kpi"><div class="label">—</div><div class="value">—</div><div class="sub">—</div></div>
      <div class="kpi"><div class="label">—</div><div class="value">—</div><div class="sub">—</div></div>
      <div class="kpi"><div class="label">—</div><div class="value">—</div><div class="sub">—</div></div>
    </div>

    <!-- Bộ lọc EV/BSS/Tổng dùng chung — module nào cần biết thì đăng ký
         onCpTypeChange lúc registerChart(). -->
    <div class="cp-filter" id="cp-filter">
      <button type="button" class="active" data-cp="all">⚡+🔋 Tổng</button>
      <button type="button" data-cp="ev">⚡ Trụ sạc (EV)</button>
      <button type="button" data-cp="bss">🔋 Trụ đổi pin (BSS)</button>
    </div>

    <!-- Mỗi module chart JS tự thêm 1 <div class="card"> của nó vào đây
         qua StatsCore.registerChart(). -->
    <div id="panels-mount"></div>
  </div>

  <!-- Khung dùng chung: PHẢI nạp trước mọi module chart. -->
  <script src="/static/js/stats_core.js"></script>

  <!-- Mỗi loại biểu đồ = 1 file JS tự đăng ký với StatsCore. Thêm loại
       biểu đồ mới: chỉ cần thêm 1 dòng <script src="..."> ở đây, không
       sửa gì phía trên. Thứ tự quyết định tab nào mặc định hiển thị đầu
       tiên (tab đầu tiên đăng ký sẽ active sẵn). -->
  <script src="/static/js/stats_chart_volume.js"></script>
  <script src="/static/js/stats_chart_overdue.js"></script>
  <script src="/static/js/stats_chart_errors.js"></script>
</body>
</html>
